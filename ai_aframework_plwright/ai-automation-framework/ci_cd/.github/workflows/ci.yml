name: Automated Tests CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - production
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - api_only
          - ui_only
          - full
      browser:
        description: 'Browser for UI tests'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps

    - name: Lint code
      run: |
        pip install flake8
        flake8 tests/ business/ core/ --max-line-length=120 --ignore=E501,W503
      continue-on-error: true

    - name: Run tests
      env:
        TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}
        SELF_HEALING: true
        AI_ANALYSIS: true
        VIDEO_RECORDING: onfailure
      run: |
        pytest tests/ \
          --env=${{ github.event.inputs.environment || 'qa' }} \
          --browser=${{ github.event.inputs.browser || 'chromium' }} \
          --headless=true \
          -n 4 \
          -m ${{ github.event.inputs.test_suite || 'smoke' }} \
          --alluredir=reports/allure-results \
          --html=reports/report.html \
          --self-contained-html \
          -v

    - name: Generate Allure Report
      if: always()
      run: |
        pip install allure-pytest
        allure generate reports/allure-results -o reports/allure-report --clean

    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-results
        path: reports/allure-results/

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-report
        path: reports/report.html

    - name: Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: screenshots
        path: reports/screenshots/

    - name: Upload Videos
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: videos
        path: reports/videos/

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: reports/allure-report

    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('reports/test_execution_data.json', 'utf8'));
          
          const comment = `## 🧪 Test Results
          
          - **Total Tests:** ${data.total_tests}
          - **Passed:** ✅ ${data.passed}
          - **Failed:** ❌ ${data.failed}
          - **Skipped:** ⏭️ ${data.skipped}
          - **Pass Rate:** ${data.pass_rate.toFixed(2)}%
          - **Duration:** ${data.duration.toFixed(2)}s
          
          [📊 View Full Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }})`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });