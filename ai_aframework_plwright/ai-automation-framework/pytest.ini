[pytest]
# Pytest configuration - API TESTS ONLY
# UI tests use Behave (see behave.ini)

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths - API and Integration tests only
testpaths = tests/api tests/integration

# Markers
markers =
    smoke: Smoke tests (quick sanity checks)
    regression: Regression test suite
    api: API tests only
    integration: Integration tests
    e2e: End-to-end tests
    critical: Critical functionality tests
    slow: Tests that take longer to execute
    wip: Work in progress tests (not ready for CI)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Output
console_output_style = progress
junit_family = xunit2

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (if pytest-cov is used)
addopts =
    --strict-markers
    --tb=short
    --maxfail=5

# Timeout (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Parallel execution (requires pytest-xdist)
# -n auto uses all available CPU cores
# Can be overridden with -n <number>

# Allure
allure_no_capture = true