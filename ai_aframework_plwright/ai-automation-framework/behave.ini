[behave]
# Behave configuration for UI tests

# Paths
paths = tests/ui/features

# Output
show_skipped = false
show_timings = true
color = true
stdout_capture = false
stderr_capture = false
log_capture = false

# Logging
logging_level = INFO
logging_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
logging_datefmt = %Y-%m-%d %H:%M:%S

# Formatters
# format = pretty
# Additional formatters can be specified with -f flag:
# behave -f html -o reports/behave-report.html
# Note: Formatters are now configured in run_bdd_tests.py

# Tags
# Run specific tags: behave --tags=@smoke
# Exclude tags: behave --tags=~@wip

# Default tags to skip
default_tags = -wip,-skip

# Summary
summary = true

# Dry run (test without execution)
# dry_run = false

# Stop on first failure
# stop = false

# Parallel execution (requires behave-parallel)
# processes = 4

# JUnit XML output
# junit = true
# junit_directory = reports/junit

# Allure integration is now enabled above in the format section
